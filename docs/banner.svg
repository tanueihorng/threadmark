<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Threadmark — Mark what matters">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8ff4f" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#b8ff4f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="#0b0e0c"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#29302b"/>

  <!-- mark -->
  <rect x="72" y="86" width="10" height="34" rx="5" fill="none" stroke="#b8ff4f" stroke-width="2.5"/>

  <text x="104" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.4" fill="#f1f5f2">Threadmark</text>
  <text x="72" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="-0.6" fill="#b8ff4f">Mark what matters.</text>

  <text x="72" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#8e9991">A private, local meeting recorder that turns conversations into</text>
  <text x="72" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#8e9991">speaker-labelled transcripts and evidence-backed context for AI agents.</text>

  <text x="72" y="278" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.6" fill="#5c6660">APPLE SILICON  ·  WHISPER + PYANNOTE  ·  NOTHING LEAVES YOUR MAC</text>

  <!-- transcript motif -->
  <g transform="translate(700 64)">
    <rect x="0" y="0" width="430" height="192" rx="14" fill="#101311" stroke="#29302b"/>

    <text x="24" y="34" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#b8ff4f">00:04:12</text>
    <text x="104" y="34" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#8e9991">WEI HONG</text>
    <rect x="104" y="46" width="252" height="7" rx="3.5" fill="#3a423c"/>
    <rect x="104" y="63" width="180" height="7" rx="3.5" fill="#3a423c"/>
    <rect x="292" y="63" width="46" height="7" rx="3.5" fill="#3a423c"/>
    <rect x="292" y="74" width="46" height="2" rx="1" fill="#ffc44f"/>

    <text x="24" y="112" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#b8ff4f">00:04:26</text>
    <text x="104" y="112" font-family="SF Mono, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#8e9991">TOMMY</text>
    <rect x="104" y="124" width="140" height="7" rx="3.5" fill="#3a423c"/>
    <rect x="252" y="124" width="72" height="7" rx="3.5" fill="#3a423c"/>
    <rect x="252" y="135" width="72" height="2.5" rx="1.25" fill="#ff4d5e"/>
    <rect x="104" y="141" width="206" height="7" rx="3.5" fill="#3a423c"/>

    <rect x="24" y="164" width="9" height="9" rx="2" fill="#b8ff4f"/>
    <text x="44" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8e9991">2 passages flagged — it tells you when it is unsure</text>
  </g>
</svg>
